<html>
    <head>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <div class="contact-form-section">
                <form>
                    <h1 class="contact-form-heading">Reach <span>Out</span></h1>
                    <p class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</p>
                    <label for="name">Full Name</label>
                    <input id="name" class="contact-input" type="text" placeholder="Farhan Shaikh"/>
                    <label for="contact">Email</label>
                    <input id="contact" class="contact-input" type="text" placeholder="farhan.241@gmail.com" />
                    <label for="message">Message</label>
                    <textarea id="message" class="contact-textarea" rows="4" cols="50" placeholder="I would love to connect and want to be a part of this tech..."></textarea>
                    <button class="contact-submit-button" type="button" onclick="submitForm()">Connected 🎉</button>
                </form>
                <img class="contact-image" src="images/connect.jpg" alt="A robotic hand and a human hand moving towards each other to do handshake"/>
            </div>
        </main>
    </body>
</html>
